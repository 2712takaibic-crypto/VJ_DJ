<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>PoC — Preview Publisher</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #ddd;
        font: 12px/1.5 system-ui, sans-serif;
      }
      #view {
        display: block;
        width: 480px;
        height: 270px;
      }
      #log {
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="view" width="960" height="540"></canvas>
    <div id="log"></div>
    <script type="module">
      const SCENE_W = 1920
      const SCENE_H = 1080
      const MAX_UNACKED = 2
      // プレビュー解像度は経路の優劣を左右するため可変にする。
      // ImageBitmap は GPU 側で完結するので概ね固定コスト、
      // 読み戻しは画素数に比例するはず — という仮説の検証用。
      const params = new URLSearchParams(location.search)
      const PREVIEW_W = Number(params.get('w') ?? '480')
      const PREVIEW_H = Number(params.get('h') ?? '270')

      const logEl = document.getElementById('log')
      const say = (m) => {
        logEl.textContent += m + '\n'
        window.poc.log(m)
      }

      const quantile = (sorted, q) => {
        if (!sorted.length) return null
        const i = Math.min(sorted.length - 1, Math.max(0, Math.ceil(q * sorted.length) - 1))
        return sorted[i]
      }
      const stats = (arr) => {
        const s = [...arr].sort((a, b) => a - b)
        return {
          n: s.length,
          mean: s.length ? s.reduce((a, b) => a + b, 0) / s.length : null,
          p50: quantile(s, 0.5),
          p95: quantile(s, 0.95),
          p99: quantile(s, 0.99),
          max: s.length ? s[s.length - 1] : null,
        }
      }

      const waitForPort = () =>
        new Promise((resolve) => {
          const onMessage = (e) => {
            if (e.source !== window) return
            if (!e.data || !(window.poc.envelope in e.data)) return
            window.removeEventListener('message', onMessage)
            const port = e.ports[0]
            port.start()
            resolve(port)
          }
          window.addEventListener('message', onMessage)
          window.poc.ready()
        })

      const SHADER = `
struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };

@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  let q = p[i];
  var o: VOut;
  o.pos = vec4f(q, 0.0, 1.0);
  o.uv = vec2f((q.x + 1.0) * 0.5, (1.0 - q.y) * 0.5);
  return o;
}

struct U { time: f32 };
@group(0) @binding(0) var<uniform> u: U;

// 合成結果を模したシーン。実際の負荷より軽いが、
// ここで測りたいのは「publish 処理が何 ms 追加するか」なので問題ない。
@fragment fn fsScene(in: VOut) -> @location(0) vec4f {
  let c = 0.5 + 0.5 * cos(u.time + in.uv.xyx * 6.2831853 + vec3f(0.0, 2.0, 4.0));
  let grid = step(0.98, fract(in.uv.x * 24.0)) + step(0.98, fract(in.uv.y * 13.5));
  return vec4f(clamp(c + grid * 0.5, vec3f(0.0), vec3f(1.0)), 1.0);
}

@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;

@fragment fn fsBlit(in: VOut) -> @location(0) vec4f {
  return textureSample(tex, samp, in.uv);
}
`

      const main = async () => {
        const cfg = await window.poc.config()
        const port = await waitForPort()

        const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' })
        const device = await adapter.requestDevice()
        const canvasFormat = navigator.gpu.getPreferredCanvasFormat()
        const module = device.createShaderModule({ code: SHADER })

        // ---- シーン (合成結果に相当) ----
        // 設計どおり中間テクスチャは rgba16float
        const sceneTex = device.createTexture({
          size: [SCENE_W, SCENE_H],
          format: 'rgba16float',
          usage:
            GPUTextureUsage.RENDER_ATTACHMENT |
            GPUTextureUsage.TEXTURE_BINDING |
            GPUTextureUsage.COPY_SRC,
        })
        const sceneView = sceneTex.createView()

        const uniform = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        })
        const scenePipeline = device.createRenderPipeline({
          layout: 'auto',
          vertex: { module, entryPoint: 'vs' },
          fragment: { module, entryPoint: 'fsScene', targets: [{ format: 'rgba16float' }] },
          primitive: { topology: 'triangle-list' },
        })
        const sceneBind = device.createBindGroup({
          layout: scenePipeline.getBindGroupLayout(0),
          entries: [{ binding: 0, resource: { buffer: uniform } }],
        })

        const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' })
        const makeBlitPipeline = (format) =>
          device.createRenderPipeline({
            layout: 'auto',
            vertex: { module, entryPoint: 'vs' },
            fragment: { module, entryPoint: 'fsBlit', targets: [{ format }] },
            primitive: { topology: 'triangle-list' },
          })

        const blitToCanvas = makeBlitPipeline(canvasFormat)
        const blitToRgba8 = makeBlitPipeline('rgba8unorm')
        const bindFor = (pipeline) =>
          device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: sampler },
              { binding: 1, resource: sceneView },
            ],
          })
        const canvasBind = bindFor(blitToCanvas)
        const rgba8Bind = bindFor(blitToRgba8)

        // 目視確認用の表示 canvas
        const view = document.getElementById('view')
        const viewCtx = view.getContext('webgpu')
        viewCtx.configure({ device, format: canvasFormat, alphaMode: 'opaque' })

        // ---- 経路 A: OffscreenCanvas → transferToImageBitmap ----
        const off = new OffscreenCanvas(PREVIEW_W, PREVIEW_H)
        const offCtx = off.getContext('webgpu')
        offCtx.configure({ device, format: canvasFormat, alphaMode: 'opaque' })

        // ---- 経路 B: copyTextureToBuffer → mapAsync ----
        const readTex = device.createTexture({
          size: [PREVIEW_W, PREVIEW_H],
          format: 'rgba8unorm',
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
        })
        const readView = readTex.createView()
        // bytesPerRow は 256 の倍数でなければならない
        const bytesPerRow = Math.ceil((PREVIEW_W * 4) / 256) * 256
        const stagingSize = bytesPerRow * PREVIEW_H
        const stagingPool = []
        const acquireStaging = () =>
          stagingPool.pop() ??
          device.createBuffer({
            size: stagingSize,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
          })

        const renderPass = (encoder, target, pipeline, bind, clear) => {
          const pass = encoder.beginRenderPass({
            colorAttachments: [
              { view: target, clearValue: clear, loadOp: 'clear', storeOp: 'store' },
            ],
          })
          pass.setPipeline(pipeline)
          pass.setBindGroup(0, bind)
          pass.draw(3)
          pass.end()
        }

        // ---- 計測ループ ----
        let seq = 0
        let unacked = 0
        let skipped = 0
        const latencies = []
        const drawTimes = []

        port.onmessage = (event) => {
          if (event.data.t === 'ack') {
            unacked = Math.max(0, unacked - 1)
            latencies.push(event.data.latencyMs)
            drawTimes.push(event.data.drawMs)
          }
        }

        const runPhase = (name, mode, seconds) =>
          new Promise((resolve) => {
            latencies.length = 0
            drawTimes.length = 0
            seq = 0
            unacked = 0
            skipped = 0
            const frameIntervals = []
            const publishCosts = []
            let published = 0
            let last = performance.now()
            const started = last
            let frame = 0

            port.postMessage({ t: 'phase', name })

            const tick = (now) => {
              frameIntervals.push(now - last)
              last = now
              frame++

              // --- シーン描画 (毎フレーム) ---
              device.queue.writeBuffer(uniform, 0, new Float32Array([now / 1000]))
              const encoder = device.createCommandEncoder()
              renderPass(encoder, sceneView, scenePipeline, sceneBind, {
                r: 0,
                g: 0,
                b: 0,
                a: 1,
              })
              renderPass(
                encoder,
                viewCtx.getCurrentTexture().createView(),
                blitToCanvas,
                canvasBind,
                { r: 0, g: 0, b: 0, a: 1 },
              )
              device.queue.submit([encoder.finish()])

              // --- プレビュー発行 (30fps = 2 フレームに 1 回) ---
              if (mode !== 'none' && frame % 2 === 0) {
                if (unacked > MAX_UNACKED) {
                  // 背圧: 受信側が追いつかない場合は捨てる
                  skipped++
                } else {
                  const t0 = performance.now()
                  if (mode === 'bitmap') {
                    const enc = device.createCommandEncoder()
                    renderPass(
                      enc,
                      offCtx.getCurrentTexture().createView(),
                      blitToCanvas,
                      canvasBind,
                      { r: 0, g: 0, b: 0, a: 1 },
                    )
                    device.queue.submit([enc.finish()])
                    const bitmap = off.transferToImageBitmap()
                    seq++
                    unacked++
                    published++
                    port.postMessage(
                      {
                        t: 'bitmap',
                        seq,
                        bitmap,
                        publishedAtAbs: performance.timeOrigin + performance.now(),
                      },
                      [bitmap],
                    )
                    publishCosts.push(performance.now() - t0)
                  } else {
                    const staging = acquireStaging()
                    const enc = device.createCommandEncoder()
                    renderPass(enc, readView, blitToRgba8, rgba8Bind, {
                      r: 0,
                      g: 0,
                      b: 0,
                      a: 1,
                    })
                    enc.copyTextureToBuffer(
                      { texture: readTex },
                      { buffer: staging, bytesPerRow },
                      [PREVIEW_W, PREVIEW_H],
                    )
                    device.queue.submit([enc.finish()])
                    seq++
                    unacked++
                    published++
                    const mySeq = seq
                    // 同期コストはここまで。mapAsync 以降は非同期。
                    publishCosts.push(performance.now() - t0)
                    void staging.mapAsync(GPUMapMode.READ).then(() => {
                      const copy = staging.getMappedRange().slice(0)
                      staging.unmap()
                      stagingPool.push(staging)
                      port.postMessage(
                        {
                          t: 'pixels',
                          seq: mySeq,
                          buffer: copy,
                          width: PREVIEW_W,
                          height: PREVIEW_H,
                          bytesPerRow,
                          publishedAtAbs: performance.timeOrigin + performance.now(),
                        },
                        [copy],
                      )
                    })
                  }
                }
              }

              if (now - started < seconds * 1000) {
                requestAnimationFrame(tick)
              } else {
                // 遅れて届く ack を拾うため少し待つ
                setTimeout(() => {
                  resolve({
                    name,
                    mode,
                    seconds: (now - started) / 1000,
                    frames: frameIntervals.length,
                    fps: frameIntervals.length / ((now - started) / 1000),
                    frameIntervalMs: stats(frameIntervals.slice(1)),
                    publishCostMs: stats(publishCosts),
                    latencyMs: stats(latencies),
                    receiverDrawMs: stats(drawTimes),
                    published,
                    acked: latencies.length,
                    skippedByBackpressure: skipped,
                  })
                }, 500)
              }
            }
            requestAnimationFrame(tick)
          })

        const seconds = cfg.seconds
        say(`preview ${PREVIEW_W}x${PREVIEW_H} @30fps / scene ${SCENE_W}x${SCENE_H} @60fps`)

        say(`— baseline (publish なし, ${seconds}s) —`)
        const baseline = await runPhase('baseline', 'none', seconds)
        say(`  ${baseline.fps.toFixed(2)} fps, p99=${baseline.frameIntervalMs.p99.toFixed(2)}ms`)

        say(`— A: ImageBitmap transfer (${seconds}s) —`)
        const bitmap = await runPhase('imagebitmap', 'bitmap', seconds)
        say(
          `  publish=${bitmap.publishCostMs.p99.toFixed(3)}ms(p99) ` +
            `latency=${bitmap.latencyMs.p99.toFixed(2)}ms(p99) fps=${bitmap.fps.toFixed(2)}`,
        )

        say(`— B: copyTextureToBuffer + mapAsync (${seconds}s) —`)
        const readback = await runPhase('readback', 'readback', seconds)
        say(
          `  publish=${readback.publishCostMs.p99.toFixed(3)}ms(p99) ` +
            `latency=${readback.latencyMs.p99.toFixed(2)}ms(p99) fps=${readback.fps.toFixed(2)}`,
        )

        window.poc.report({ phase: 'done', results: { baseline, bitmap, readback } })
      }

      main().catch((e) => {
        say('FATAL ' + String(e) + '\n' + (e.stack ?? ''))
        window.poc.report({ phase: 'done', fatal: String(e) })
      })
    </script>
  </body>
</html>
